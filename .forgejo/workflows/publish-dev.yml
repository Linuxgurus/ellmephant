name: publish-dev

# Publish `dev`: build the runtime image and push it to Harbor as
#
#   :v<X.Y.Z>-dev.<n>   the dev LINE — a prerelease of the next release, `n` commits past the last tag
#   :sha-<commit>       the immutable handle; pin THIS in a deployment
#   :edge               the moving name for "newest dev"
#
# ★ ONE WORD, ONE MEANING (James, 2026-10-25): `edge` only ever moves from `dev` in this repo. A release
# on `main` publishes `X.Y.Z` + `latest` and never touches `edge`, so "edge" cannot mean two things.
#
# ★ WHY <n> IS "COMMITS SINCE THE LAST TAG": a lifetime commit count (`-dev.394`) grows for ever and
# answers nothing. `v1.2.0-dev.7` says "seven commits toward 1.2.0", which is the question anyone
# actually asks when deciding whether to roll.
#
# ★ A VERSION IS SPENT ONCE. The dev tag is derived from the commit, so re-running this job for the
# same commit REUSES the build (the `sha-` handle exists) instead of producing a second artifact for
# one version. If the tag exists pointing at different bytes, the job FAILS rather than re-pointing it:
# a version-shaped name that moves is the defect this whole change is meant to remove.
#
# This file is ALSO the CI gate. Two jobs: `test` (the gate) then `publish`. `publish` needs `test`
# and is skipped on a pull request, so a PR gets a real status and publishes nothing, and a push to
# `dev` cannot move `edge` from code that does not pass.
on:
  push:
    branches: [dev]
  # A `pull_request` runs `test` only -- the guard is on the `publish` job below.
  pull_request:
  workflow_dispatch: # manual republish, e.g. after rotating the robot

env:
  REGISTRY: harbor.vn.linuxguru.net
  IMAGE: harbor.vn.linuxguru.net/library/ellmephant
  BUILDER: harbor.vn.linuxguru.net/library/ellmephant-builder
  BUILDER_PROFILE: rust-lean
  SOURCE_URL: https://git.vn.linuxguru.net/soma/ellmephant

# ★ ONE PUBLISH AT A TIME, PER REPO (2026-10-25). A release tag pushed seconds after the merge that
# triggers a trunk build started both runs at once; neither saw the other's `sha-` handle and the same
# commit was built twice. Serialising makes the second run find the first build and promote it.
concurrency:
  group: publish-${{ github.repository }}
  cancel-in-progress: false

jobs:
  # The gate: format, lints and the suite, one cargo step at a time, in a throwaway image.
  #
  # A docker BUILD rather than a run, because the runner image (`catthehacker/ubuntu:act-22.04`) has
  # the docker CLI and NO cargo -- a container is the only way to get a toolchain, and `docker build`
  # is the path this repository already depends on below. `Dockerfile.test` is standalone
  # (`FROM rust:1-bookworm`, no Harbor, no secrets) so it behaves identically on a `dev` push and on
  # a pull request, and it does not need the registry login the publish job has. Its `cargo fetch`
  # needs crates.io egress, which was PROBED on this runner before the gate was made load-bearing.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the test image (fmt, clippy, tests)
        run: docker build --platform linux/amd64 -f Dockerfile.test -t ellmephant-test .

  publish:
    needs: test
    # The gate runs on PRs; publishing never does.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The dev tag counts commits since the last release tag, so a shallow clone would lie.
          fetch-depth: 0

      - name: Log in to Harbor
        env:
          HARBOR_USER: ${{ secrets.HARBOR_USER }}
          HARBOR_TOKEN: ${{ secrets.HARBOR_TOKEN }}
        run: |
          set -eu
          echo "$HARBOR_TOKEN" | docker login "$REGISTRY" -u "$HARBOR_USER" --password-stdin

      # The dependency layer, prebuilt (Dockerfile.builder): ~250 crates compiled once and reused as
      # the builder stage, so a fresh runner pod does not recompile them. Built lazily here rather
      # than in a path-filtered workflow, because Forgejo's `on.push.paths` is not worth depending on
      # and a second job would race this one-at-a-time runner. A miss costs one slow build; it can
      # never be wrong, since cargo recompiles whatever the image is missing.
      #
      # The tag is a fingerprint of the dependency set and the build profile, so a change to any of
      # the three files moves it by itself and a stale image cannot be reused silently.
      # Order matters and must match the Makefile: Cargo.toml, Cargo.lock, Dockerfile.builder.
      - name: Ensure the dependency image exists
        run: |
          set -eu
          hash=$(cat Cargo.toml Cargo.lock Dockerfile.builder | sha256sum | cut -c1-8)
          ref="$BUILDER:$BUILDER_PROFILE-$hash"
          echo "dependency image: $ref"
          if docker manifest inspect "$ref" > /dev/null 2>&1; then
            echo "present"
          else
            echo "missing -- building it (slow, but only once per input change)"
            docker build -f Dockerfile.builder -t "$ref" .
            docker push "$ref"
          fi
          echo "$ref" > .builder-ref

      # What the dev build of THIS commit is called. Two values, from two places:
      #   version  <- Cargo.toml: the release this is a prerelease OF
      #   dev      <- version + commits since the last release tag
      - name: Name this build
        id: name
        run: |
          set -eu
          ver=$(sed -n 's/^version *= *"\([^"]*\)".*/\1/p' Cargo.toml | head -1)
          [ -n "$ver" ] || { echo "no version in Cargo.toml"; exit 1; }
          # `--exclude '*-dev.*'` matters: without it the nearest tag is a dev tag and the distance
          # collapses to zero on the second build onwards.
          base=$(git describe --tags --abbrev=0 --match 'v[0-9]*' --exclude '*-dev.*' 2>/dev/null || true)
          if [ -n "$base" ]; then
            n=$(git rev-list --count "$base"..HEAD)
          else
            n=$(git rev-list --count HEAD)
          fi
          short=$(git rev-parse --short=7 HEAD)
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "dev=v${ver}-dev.${n}" >> "$GITHUB_OUTPUT"
          echo "short=$short" >> "$GITHUB_OUTPUT"
          echo "built from ${base:-the first commit}: $n commit(s) since"
          echo "dev name: v${ver}-dev.${n}; immutable handle: sha-${short}"

      # Build ONCE per commit. `sha-<commit>` is the artifact's identity; the version-shaped tags are
      # aliases pointed at it afterwards. Re-running the same commit therefore reuses the same bytes.
      - name: Build the image (or reuse this commit's build)
        run: |
          set -eu
          B="$IMAGE"
          DEV="${{ steps.name.outputs.dev }}"
          VER="${{ steps.name.outputs.version }}"
          SHORT="${{ steps.name.outputs.short }}"
          if docker buildx imagetools inspect "$B:sha-$SHORT" > /dev/null 2>&1; then
            echo "sha-$SHORT already exists -- reusing it, not rebuilding"
          else
            docker build --platform linux/amd64 \
              --build-arg BUILDER="$(cat .builder-ref)" \
              --build-arg VERSION="$VER" \
              --build-arg REVISION="$(git rev-parse HEAD)" \
              --label org.opencontainers.image.version="$VER" \
              --label org.opencontainers.image.revision="$(git rev-parse HEAD)" \
              --label org.opencontainers.image.source="$SOURCE_URL" \
              --label net.linuxguru.build="$DEV" \
              -t "$B:sha-$SHORT" .
            # Immutable handle FIRST: it exists before any version-shaped name points at it.
            docker push "$B:sha-$SHORT"
          fi

      # Every alias is created FROM THE MANIFEST, not from a local image -- so this is the same code
      # path whether this run built the image or a previous one did.
      - name: Point the dev line and edge at the build, then prove they agree
        run: |
          set -eu
          B="$IMAGE"
          DEV="${{ steps.name.outputs.dev }}"
          SHORT="${{ steps.name.outputs.short }}"
          want=$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "$B:sha-$SHORT")

          if docker buildx imagetools inspect "$B:$DEV" > /dev/null 2>&1; then
            got=$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "$B:$DEV")
            if [ "$got" != "$want" ]; then
              echo "REFUSING: $B:$DEV already exists at $got, but this commit builds $want."
              echo "A version-shaped tag must never move. Bump the version, or investigate why the"
              echo "same commit produces different bytes (a moved base image is the usual reason)."
              exit 1
            fi
            echo "$DEV already points at this build"
          else
            docker buildx imagetools create -t "$B:$DEV" "$B:sha-$SHORT"
          fi

          # `edge` is the only moving name a dev build owns.
          docker buildx imagetools create -t "$B:edge" "$B:sha-$SHORT"

          # MEASURED, not declared: read the tags back and compare digests.
          for t in "$DEV" edge; do
            got=$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "$B:$t")
            [ "$got" = "$want" ] || { echo "MISMATCH: $B:$t is $got, expected $want"; exit 1; }
            echo "verified $B:$t -> $got"
          done
          {
            echo "published $B:{sha-$SHORT, $DEV, edge}"
            echo "index digest $want"
          } >> "$GITHUB_STEP_SUMMARY"
