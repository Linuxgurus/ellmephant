name: test

# THE GATE `main` never had (issue #43): run the repository's own `make test` on every change.
#
# Since 2026-10-26 the gate builds in a **build pod**, not through the runner's docker daemon
# (Linuxguru/kube-estates#21). Why: the runner's DinD sidecar is a privileged pod, so anything it
# starts lands in /sys/fs/cgroup/docker/* — outside kubepods, outside the pod's limits, invisible
# to cAdvisor. A build pod is an ordinary pod: its limits bind and its CPU is attributed.
#
# The job itself now only dispatches: it writes a kubeconfig, creates a Job in `ci-builds`, waits,
# and relays the build log. The build runs in `library/ci-base` with `/harness/build.sh`
# (forgejo/ci-builder), which clones THIS commit and runs `buildah build`.
#
# PUSH=0: a gate proves the image builds; it does not need to be in Harbor. The registry cache
# means the expensive dependency layers are pulled rather than compiled on a hit.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install kubectl
        run: |
          set -eu
          curl -sSLo kubectl "https://dl.k8s.io/release/v1.36.5/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/kubectl
          kubectl version --client

      - name: build the gate image in a build pod
        env:
          CI_KUBECONFIG: ${{ secrets.CI_KUBECONFIG }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -eu
          echo "$CI_KUBECONFIG" | base64 -d > "$RUNNER_TEMP/kubeconfig"
          export KUBECONFIG="$RUNNER_TEMP/kubeconfig"

          # The dependency image's tag is a fingerprint of the dependency set (same computation as
          # publish-dev.yml and the Makefile), so this is a cache hit unless Cargo.toml/lock or
          # Dockerfile.builder changed. A miss costs one slow build, never a wrong one.
          builder="harbor.vn.linuxguru.net/library/ellmephant-builder:rust-lean-$(cat Cargo.toml Cargo.lock Dockerfile.builder | sha256sum | cut -c1-8)"

          job=$(kubectl create -f - -o jsonpath='{.metadata.name}' <<YAML
          apiVersion: batch/v1
          kind: Job
          metadata:
            generateName: gate-
            namespace: ci-builds
          spec:
            backoffLimit: 0
            activeDeadlineSeconds: 1800
            # ★ A FINISHED JOB IS STILL A JOB TO THE QUOTA. `ci-builds` allows 5 (count/jobs.batch), so
            # with an hour of retention the SIXTH build in an hour is refused — which is what blocked
            # main's release on 2026-10-26 with an 8-second failure and no pod. Ten minutes is enough
            # for a human to look; the log is relayed below in any case.
            ttlSecondsAfterFinished: 600
            template:
              spec:
                restartPolicy: Never
                containers:
                  - name: build
                    image: harbor.vn.linuxguru.net/library/ci-base:0.4.0
                    command: ["/harness/build.sh"]
                    securityContext:
                      privileged: true
                    env:
                      - { name: REPO_URL,   value: "https://git.vn.linuxguru.net/${REPO}.git" }
                      - { name: GIT_REF,    value: "${SHA}" }
                      - { name: DOCKERFILE, value: "Dockerfile.test" }
                      - { name: IMAGE,      value: "localhost/gate:${SHA}" }
                      - { name: BUILDER,    value: "${builder}" }
                      - { name: CACHE_REPO, value: "harbor.vn.linuxguru.net/library/ellmephant-gate-cache" }
                      - { name: PUSH,       value: "0" }
                      - { name: GIT_USER, valueFrom: { secretKeyRef: { name: ci-git, key: username } } }
                      - { name: GIT_PASS, valueFrom: { secretKeyRef: { name: ci-git, key: password } } }
                      - { name: REG_USER, valueFrom: { secretKeyRef: { name: ci-registry, key: username } } }
                      - { name: REG_PASS, valueFrom: { secretKeyRef: { name: ci-registry, key: password } } }
                    resources:
                      requests: { cpu: "2", memory: 2Gi }
                      limits:   { cpu: "4", memory: 8Gi }
          YAML
          )

          echo "build job: $job"
          # ★ RELAY THE LOG, THEN DROP THE JOB. The workflow's value is the log, not the object: keeping
          # the Job until its TTL spends a quota slot that the next build needs (five is the whole
          # budget). `|| true` on the delete: a failure to tidy must not fail a green build.
          if kubectl -n ci-builds wait --for=condition=complete "job/$job" --timeout=1800s; then
            kubectl -n ci-builds logs "job/$job" --tail=-1
            kubectl -n ci-builds delete "job/$job" --ignore-not-found || true
          else
            echo "build failed or timed out:"
            kubectl -n ci-builds logs "job/$job" --tail=200 || true
            kubectl -n ci-builds delete "job/$job" --ignore-not-found || true
            exit 1
          fi
