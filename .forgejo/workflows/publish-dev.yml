name: publish-dev

# Build the image once and publish it to BOTH registries: Harbor (private, LAN-only, what the
# cluster pulls) and GHCR (public, what everyone else pulls).
#
# This replaces the old `.githooks/post-commit` hook, which did the same job by building with
# podman on the developer's machine: emulated amd64 on Apple Silicon (its own comment admitted it
# was slow), and only if that machine happened to be awake. Here the build runs on the cluster,
# natively amd64.
#
# Tags match what the hook used -- `edge` plus `sha-<short>` -- so nothing downstream has to move.
#
# Credentials are repo-level Actions secrets. HARBOR_USER / HARBOR_TOKEN are written by
# `module.forgejo_setup` in stacks/mantle: the Harbor robot `robot$library+forgejo`, scoped to
# repository pull+push and tag create+list on the `library` project -- notably it cannot delete.
# GHCR_USER / GHCR_TOKEN are for the public mirror and are NOT written by that module; the token is
# a GitHub token with `write:packages`. See DEVELOPMENT.md (Publishing).
on:
  push:
    branches: [dev]
  workflow_dispatch: # manual republish, e.g. after rotating the robot

env:
  REGISTRY: harbor.vn.linuxguru.net
  IMAGE: harbor.vn.linuxguru.net/library/ellmephant
  BUILDER: harbor.vn.linuxguru.net/library/ellmephant-builder
  # Harbor is private, so this is the public face of the same image.
  GHCR_IMAGE: ghcr.io/jdblack/ellmephant
  # A cosmetic prefix only. The tag's real content is the input hash computed below, so a profile
  # change or a dependency change moves the tag by itself -- there is nothing here to remember.
  BUILDER_PROFILE: rust-lean

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Harbor
        env:
          HARBOR_USER: ${{ secrets.HARBOR_USER }}
          HARBOR_TOKEN: ${{ secrets.HARBOR_TOKEN }}
        run: |
          set -eu
          # The robot name contains a `$` (robot$library+forgejo); quoted, so the shell leaves it be.
          echo "$HARBOR_TOKEN" | docker login "$REGISTRY" -u "$HARBOR_USER" --password-stdin

      # The dependency layer, prebuilt (Dockerfile.builder). Building it here, lazily, rather than
      # in a separate path-filtered workflow, keeps this correct without depending on whether
      # Forgejo's `on.push.paths` matches and without racing a second job on this one-at-a-time
      # runner. A miss costs one slow build; it can never be *wrong*, because cargo recompiles
      # whatever the image is missing.
      # The dependency image is a pure function of exactly three files: the dependency set
      # (`Cargo.toml`, `Cargo.lock`) and the build profile (`Dockerfile.builder`, which carries the
      # codegen/linker ENVs). Hashing them together makes the TAG the fingerprint -- change any of
      # the three and the tag moves on its own, so a stale image cannot be silently reused and
      # nobody has to remember to bump anything.
      #
      # Order matters and must match the Makefile: Cargo.toml, Cargo.lock, Dockerfile.builder.
      - name: Ensure the dependency image exists
        run: |
          set -eu
          hash=$(cat Cargo.toml Cargo.lock Dockerfile.builder | sha256sum | cut -c1-8)
          ref="$BUILDER:$BUILDER_PROFILE-$hash"
          echo "dependency image: $ref"
          if docker manifest inspect "$ref" > /dev/null 2>&1; then
            echo "present"
          else
            echo "missing -- building it (slow, but only once per input change)"
            docker build -f Dockerfile.builder -t "$ref" .
            docker push "$ref"
          fi
          # Hand the exact tag to the build, so it cannot drift from the image this job verified.
          echo "$ref" > .builder-ref

      - name: Build and push
        run: |
          set -eu
          short=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "building $IMAGE:sha-$short"
          docker build --platform linux/amd64 \
            --build-arg BUILDER="$(cat .builder-ref)" \
            -t "$IMAGE:edge" -t "$IMAGE:sha-$short" .
          # sha-<short> first: it is the immutable handle, so it exists before the moving tag.
          docker push "$IMAGE:sha-$short"
          docker push "$IMAGE:edge"
          echo "pushed $IMAGE:sha-$short and $IMAGE:edge"

      # Harbor is private; this is the public half of the same build. `docker tag` (not a rebuild)
      # keeps the DIGEST identical, so the image the cluster runs and the image anyone can pull are
      # provably the same bytes. Skipped only if the secrets are absent -- and then it FAILS rather
      # than skipping quietly, because a public mirror that silently stops publishing is worse than
      # one that says why.
      - name: Mirror to GHCR (public)
        env:
          GHCR_USER: ${{ secrets.GHCR_USER }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          set -eu
          if [ -z "${GHCR_TOKEN:-}" ] || [ -z "${GHCR_USER:-}" ]; then
            echo "GHCR_USER / GHCR_TOKEN are not set (repo secrets): the public mirror did NOT run."
            echo "Set them (token needs write:packages) -- see DEVELOPMENT.md (Publishing)."
            exit 1
          fi
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
          short=$(echo "${{ github.sha }}" | cut -c1-7)
          for tag in "sha-$short" "edge"; do
            docker tag "$IMAGE:$tag" "$GHCR_IMAGE:$tag"
            docker push "$GHCR_IMAGE:$tag"
          done
          echo "mirrored $GHCR_IMAGE:sha-$short and :edge"
