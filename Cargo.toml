[package]
name = "llmphant"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Single-binary, SQLite-backed long-term memory for AI agents"
license = "MIT OR Apache-2.0"
repository = "https://example.invalid/llmphant"
readme = "README.md"

# NOTE: this is the P1–P4 dependency set. `sqlite-vec` (in-process vec0) and `sha2`
# (row hash) landed with P4. Candle/tokenizers/safetensors/hf-hub (the Qwen3 encoder,
# P3) are still intentionally absent so `cargo test` stays fast/offline — see PLAN.md §4.

[lib]
name = "llmphant"
path = "src/lib.rs"

[[bin]]
name = "llmphant"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
rusqlite = { version = "0.40", features = ["bundled"] }
# NOTE: PLAN §4 pinned `=0.1.10-alpha.4`, but that crate package is unbuildable — its
# `sqlite-vec.c` includes `sqlite-vec-diskann.c` (default `SQLITE_VEC_ENABLE_DISKANN 1`)
# and that file is missing from the published package (hence its failed docs.rs build).
# 0.1.9 is the last version that compiles from crates.io.
sqlite-vec = "=0.1.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
thiserror = "2"
regex = "1"
sha2 = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
