{{- if .Values.networkPolicy.enabled }}
{{/*
Opt-in lockdown. Rules are free-form so the cluster's own conventions (gateway pod selector,
node IPs for kubelet probes, DNS, the Hub for weight fetches) win over anything invented here.
Leaving a list empty denies that direction — remember kubelet probes arrive from the node.
*/}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ellmephant.fullname" . }}
  labels:
    {{- include "ellmephant.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "ellmephant.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  {{- with .Values.networkPolicy.ingress }}
  ingress:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.networkPolicy.egress }}
  egress:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
