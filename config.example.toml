# Copy to ~/.ellmephant/config.toml and edit. Flags override these; these override the
# built-in defaults. Every field is optional.

model = "Qwen/Qwen3-Embedding-0.6B"   # HF repo id, or a directory name under models/
revision = "main"                      # branch/tag (resolved once to a sha) or a pinned sha
cache_dir = ""                         # weights cache root; empty = ~/.ellmephant/models
offline = false                        # true = never open a socket (SPEC §6.4)
dim = 1024                             # MRL allows 32..=1024; frozen at CREATE
precision = "bf16"                     # bf16 (default) | f16
device = "cpu"                         # cpu | metal
instruction = "Given a question, retrieve relevant memories"  # query side only
default_k = 5                          # search result count
default_max_distance = 0.6             # cosine-distance ceiling when a search omits it; null = off
port = 8888                            # MCP HTTP port (`mcp --stdio` ignores it)

# How long the encode worker sleeps between jobs, in milliseconds. It is also the worker's idle poll
# interval, so it bounds how long a freshly written memory stays invisible to a *semantic* search
# (a write queues its document; the worker indexes it). See ENCODE-WORKER.md.
encode_interval_ms = 1000
