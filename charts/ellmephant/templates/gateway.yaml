{{- if .Values.gateway.enabled }}
{{- if and (not .Values.gateway.domain) (not .Values.gateway.hostname) }}
{{- fail "gateway.enabled=true needs gateway.domain or gateway.hostname" }}
{{- end }}
{{- $gw := deepCopy .Values.gateway }}
{{- if not $gw.httpRoutes }}
{{- $_ := set $gw "httpRoutes" (list (dict)) }}
{{- end }}
{{- include "ellmephant.gateway.expose" (dict
      "root" $
      "cfg" $gw
      "name" (.Values.gateway.listenerName | default (include "ellmephant.fullname" .))
      "backendName" (include "ellmephant.fullname" .)
      "backendPort" .Values.service.port
      "labels" (include "ellmephant.labels" .)) }}
{{- end }}
