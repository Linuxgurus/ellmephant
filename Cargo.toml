[package]
name = "llmphant"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Single-binary, SQLite-backed long-term memory for AI agents"
license = "MIT OR Apache-2.0"
repository = "https://example.invalid/llmphant"
readme = "README.md"

# NOTE: this is the P1/P2 skeleton dependency set. Embedding deps (candle-core/-nn/
# -transformers, tokenizers, safetensors, hf-hub) and sqlite-vec are added in P2/P3 —
# see PLAN.md §4. They are intentionally absent here so `cargo test` stays fast/offline.

[lib]
name = "llmphant"
path = "src/lib.rs"

[[bin]]
name = "llmphant"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
thiserror = "2"
regex = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
