name: docker-release

# Publish images to ghcr.io. Three sources, one rule each:
#   version tag    v1.1.0       -> 1.1.0, 1.1, 1, latest
#   pre-release    v1.1.0-rc.1  -> 1.1.0-rc.1               (stable aliases untouched)
#   dev branch                   -> edge, sha-<commit>       (moving, carries no version)
# `main` never publishes: it is the merge target, not a release. Images come from tags.
on:
  push:
    branches: [dev]
    tags: ["v*"]
  workflow_dispatch: # manual build; publishes `edge` + `sha-<commit>`

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to ghcr.io with the built-in GITHUB_TOKEN
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ghcr.io requires a lowercase image path; the repo owner may not be.
      - name: Lowercase image name
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `latest` is owned by `type=semver`'s default `latest=auto`: it fires only for a stable
      # tag, never for `-rc`/`-beta`/`-alpha`. Do NOT add a raw `latest` rule - it would move
      # `latest` onto a pre-release. Pre-releases get only their exact tag.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=edge,branch=dev
            type=raw,value=edge,enable=${{ github.event_name == 'workflow_dispatch' }}
            type=sha,enable=${{ startsWith(github.ref, 'refs/heads/') }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
