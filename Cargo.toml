[package]
name = "ellmephant"
version = "1.1.0"
edition = "2024"
rust-version = "1.88"
description = "Single-binary, SQLite-backed long-term memory for AI agents"
license = "MIT"
repository = "https://github.com/jdblack/ellmephant"
readme = "README.md"

# NOTE: this is the P1–P4 dependency set. `sqlite-vec` (in-process vec0) and `sha2`
# (row hash) landed with P4. The Qwen3 encoder (P3) adds candle + tokenizers +
# safetensors; it is gated behind the default-on `encoder` feature so `cargo test
# --no-default-features` can still build the store/search layers without the ML stack.
# We deliberately do NOT depend on `hf-hub` (PLAN §1 F3) — the model cache (P2.5) owns
# download, and we load safetensors/tokenizer files ourselves.

[lib]
name = "ellmephant"
path = "src/lib.rs"

[[bin]]
name = "ellmephant"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
rusqlite = { version = "0.40", features = ["bundled"] }
# NOTE: PLAN §4 pinned `=0.1.10-alpha.4`, but that crate package is unbuildable — its
# `sqlite-vec.c` includes `sqlite-vec-diskann.c` (default `SQLITE_VEC_ENABLE_DISKANN 1`)
# and that file is missing from the published package (hence its failed docs.rs build).
# 0.1.9 is the last version that compiles from crates.io.
sqlite-vec = "=0.1.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
thiserror = "2"
regex = "1"
sha2 = "0.10"
# Model fetch (SPEC §6.2). ureq 3 defaults to rustls ⇒ no OpenSSL dylib.
ureq = "3"
# Advisory `flock` on the cache lock file (SPEC §6.2).
libc = "0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# --- P3: the Qwen3 encoder (PLAN §4). Optional so `--no-default-features` builds a
# store-only binary with no ML stack.
# `candle-core`'s `metal`/`accelerate` features pull Apple-only `objc2`, which fails to
# compile off macOS (`compile_error!`), so they are enabled only for macOS targets; other
# platforms get plain CPU. See the two `[target.*]` tables below.
candle-nn = { version = "0.11", optional = true }
candle-transformers = { version = "0.11", optional = true }
# Match candle-core 0.11's `^0.22` so only one `tokenizers` links (PLAN §1).
tokenizers = { version = "0.22", optional = true }
safetensors = { version = "0.8", optional = true }

# --- P6: the CLI (PLAN §1). `rustyline` is the REPL line editor (history + completion);
# `tabled` renders the tag table. Both are pure-Rust, so the "one binary, no dylibs"
# promise (PLAN §8) still holds.
rustyline = "18"
tabled = "0.22"

# --- P7: the MCP server (PLAN §4). `rmcp` is the official Rust MCP SDK (needs rustc 1.88,
# hence the crate's rust-version bump). Default features bring the `#[tool]`/`#[tool_router]`
# macros, the `server` runtime and JSON-Schema generation; `transport-io` adds stdio and
# `transport-streamable-http-server` adds the networked MCP transport (SPEC §11).
# `tokio` is the transport runtime — the rest of ellmephant stays synchronous.
rmcp = { version = "3.5.1", features = ["transport-io", "transport-streamable-http-server"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
# Hosts rmcp's `StreamableHttpService` (a tower service) — MCP-over-HTTP is the `mcp` default.
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }

# `candle-core` is declared per-target: `metal`/`accelerate` (which transitively require
# `objc2`) only exist on macOS. On other hosts it is plain CPU, so the Linux/Docker build
# does not try to compile Apple-only crates. Both stay optional and feed `dep:candle-core`.
[target.'cfg(target_os = "macos")'.dependencies]
candle-core = { version = "0.11", optional = true, features = ["metal", "accelerate"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
candle-core = { version = "0.11", optional = true }

[features]
default = ["encoder"]
# The candle Qwen3 embedder. `cargo test --no-default-features` skips it.
encoder = [
    "dep:candle-core",
    "dep:candle-nn",
    "dep:candle-transformers",
    "dep:tokenizers",
    "dep:safetensors",
]

[dev-dependencies]
tempfile = "3"
# The in-process MCP round-trip test (tests/mcp.rs) needs the client half of the SDK.
# Features union with the normal dependency, so `cargo build` still ships no client code.
rmcp = { version = "3.5.1", features = ["client"] }
# `oneshot` drives the HTTP router in-process — the MCP-over-HTTP test needs no socket or client.
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
